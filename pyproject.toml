[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roleskills"
version = "0.1.0"
description = "Match developers to roles by extracting evidence from GitHub repositories and scoring against job requirements"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Jaybe Ammons", email = "jaybe@ammonsdatalabs.com" }
]
requires-python = ">=3.11"
keywords = ["skills", "job-matching", "github", "evidence", "developer-portfolio", "resume"]

[project.urls]
Homepage = "https://github.com/ammons-datalabs/roleskills"
Repository = "https://github.com/ammons-datalabs/roleskills"
Issues = "https://github.com/ammons-datalabs/roleskills/issues"

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "dspy-ai",
  "langfuse",
  "openai>=1.0.0",
  "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/roleskills"]

[project.scripts]
roleskills = "roleskills.cli:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "pyright",
  "ruff",
  "pre-commit"
]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = [
  "*/tests/*",
  "*/__pycache__/*",
  "*/.venv/*"
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
