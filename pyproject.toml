[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roleskills"
version = "0.1.0"
description = "Extracts, scores, and evidences role-specific skills from GitHub repos and job descriptions using agentic pipelines"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Jaybe Ammons", email = "jaybe@ammonsdatalabs.com" }
]
requires-python = ">=3.10"
dependencies = [
  "dspy-ai",
  "langfuse",
  "jinja2",
  "starlette>=0.49.1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/roleskills"]

[project.scripts]
roleskills = "roleskills.cli:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "pyright",
  "ruff",
  "pre-commit"
]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = [
  "*/tests/*",
  "*/__pycache__/*",
  "*/.venv/*"
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
